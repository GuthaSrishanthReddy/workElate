[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buildsprint-chat-cli"
version = "0.1.0"
description = "A chat interface for safe, observable website crawling"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
  "selectolax>=0.3.21,<1",
  "trafilatura>=1.8,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.4,<1"]

[project.scripts]
sitecrawl = "cli.sitecrawl.__main__:main"

[tool.setuptools.packages.find]
include = ["backend*", "cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
